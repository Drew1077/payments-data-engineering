
image: python:3.12

stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONDONTWRITEBYTECODE: "1"

cache:
  paths:
    - .cache/pip/

test:
  stage: test
  before_script:
    - python --version
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt
  script:
    - python -m py_compile src/reconciliation.py src/database.py
    - python -m pytest -q
